services:
  db-ventas:
    image: mysql:8.0
    container_name: db-ventas
    environment:
      MYSQL_DATABASE: db_ventas
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - [cite_start]vol_db_ventas:/var/lib/mysql # IE3: Persistencia de datos [cite: 33]

  back-ventas:
    image: 772895821453.dkr.ecr.us-east-1.amazonaws.com/back-ventas-repo:latest
    container_name: back-ventas
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db-ventas:3306/db_ventas
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    depends_on:
      - db-ventas

volumes:
  [cite_start]vol_db_ventas: # IE3: Justifica este volumen en la presentación [cite: 157]