name: Deploy Backend to Amazon ECR

on:
  push:
    branches: [ "deploy" ]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: ${{ github.event.repository.name }} # Toma el nombre del repo automáticamente

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    
name: Checkout Code
    uses: actions/checkout@v4

    
name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      java-version: '17'
      distribution: 'temurin'
      cache: maven

    
name: Build with Maven
    run: mvn -B package -DskipTests # Compila el JAR saltando tests para ir más rápido

    
name: Configure AWS credentials
    uses: aws-actions/configure-aws-credentials@v4
    with:
      aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }} # AWS Academy suele pedir este token
      aws-region: ${{ env.AWS_REGION }}

    
name: Login to Amazon ECR
    id: login-ecr
    uses: aws-actions/amazon-ecr-login@v2

    
name: Build and Push Image
    env:
      ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
    run: |
      docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
      docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
