name: Despliegue Backend Ventas a EKS

on:
  push:
    branches: [ "deploy" ]

env:
  AWS_REGION: us-east-1
  # Se especifica el repositorio exacto de ECR configurado para el microservicio de ventas
  ECR_REPOSITORY: examen-back-ventas
  # Se especifica el nombre del clúster de Amazon EKS
  EKS_CLUSTER_NAME: cluster-examen

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Instalar Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compilar proyecto con Maven (Generar JAR)
        # Se ejecuta la compilación omitiendo los tests para optimizar tiempos de despliegue
        run: mvn -B package -DskipTests

      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Iniciar sesion en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Construir imagen Docker y subir a la nube
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        # Se compila la imagen binaria y se transfiere al registro de contenedores de AWS
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Conectar al Cluster EKS
        # Se genera el contexto de conexión local actualizando el archivo kubeconfig con los datos del clúster
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Desplegar en Kubernetes
        run: |
          kubectl create namespace examen --dry-run=client -o yaml | kubectl apply -f -
          
          # 1. Levantar la base de datos interna primero
          kubectl apply -f k8s/db-deployment.yaml -n examen
          
          # 2. Levantar el resto de la app
          kubectl apply -f k8s/ventas-deployment.yaml -n examen
          kubectl apply -f k8s/ventas-service.yaml -n examen
          kubectl apply -f k8s/ventas-hpa.yaml -n examen
          kubectl apply -f k8s/despachos-deployment.yaml -n examen
          # (Añade también aquí los services/hpa de despachos si los tienes)
          
          # 3. Reiniciar los backends para que se conecten
          kubectl rollout restart deployment back-ventas-deployment -n examen
          kubectl rollout restart deployment back-despachos-deployment -n examen
